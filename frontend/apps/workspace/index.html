<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A73E8" />
    <title>MP Seller Tools Workspace</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round"
      rel="stylesheet"
    />
    <!-- Shown from the first moment, until the app has loaded and takes the element over. -->
    <style>
      .splash {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .splash div {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid rgba(114, 143, 173, 0.25);
        border-top-color: #728fad;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading"><div></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
